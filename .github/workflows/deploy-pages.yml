name: Build and deploy Bath Dream

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_status: ${{ steps.pages.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install dependencies
        run: npm install

      - name: Smoke test calculation core
        run: npm run test:smoke

      - name: Smoke test local API
        run: npm run test:api

      - name: Smoke test production OTP webhook
        run: npm run test:otp

      - name: Smoke test versioned pricing
        run: npm run test:pricing

      - name: Build
        run: npm run build

      - name: Build single-service production bundle
        env:
          VITE_API_URL: same-origin
        run: npx vite build --base=/ --outDir dist-production

      - name: Smoke test single-service production
        run: npm run test:production

      - name: Build deployment Docker image
        run: docker build -t bath-dream:ci .

      - name: Smoke Docker deployment
        run: |
          docker run -d --name bath-dream-ci -p 8812:8787 \
            -e OTP_SECRET=ci-otp-secret \
            -e SESSION_SECRET=ci-session-secret \
            -e OTP_ECHO=1 \
            bath-dream:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8812/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8812/api/health
          curl -fsS http://127.0.0.1:8812/ | grep 'id="root"'
          docker rm -f bath-dream-ci

      - name: Setup Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: needs.build.outputs.pages_status == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
